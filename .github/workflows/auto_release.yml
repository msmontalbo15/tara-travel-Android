name: 🚀 Automated Release, OTA Direct Distribution & Version Gatekeeper

on:
  push:
    branches:
      - live
      - 'release/**'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Semantic Version (e.g. 1.0.1+2)'
        required: false
        default: '1.0.1+2'
      min_supported_version:
        description: 'Minimum Supported Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      release_notes:
        description: 'Release Notes / Changelog'
        required: false
        default: 'Automated live release with enhanced features and stability patches.'
      maintenance_mode:
        description: 'Set Maintenance Mode (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  packages: write
  security-events: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. QUALITY, CODE AUDIT & SECURITY GATE ──────────────────────────────────
  quality-gate:
    name: 🛡️ Code Quality, Security & Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: 🔐 Setup Environment (.env for Asset Bundle)
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          fi

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Static Analysis (Zero Lints & Zero Deprecations)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 🧪 Unit Tests with LCOV Coverage Gate
        run: |
          flutter test --coverage --no-test-assets test/all_tests.dart
          if [ -f "coverage/lcov.info" ]; then
            echo "✅ Unit test execution completed with coverage."
          fi

  # ── 2. PREPARE RELEASE METADATA (AUTO-INCREMENT & RELEASE NOTES) ───────────
  prepare-release:
    name: 🔖 Auto-Increment Version & Release Notes
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      build_number: ${{ steps.meta.outputs.build_number }}
      full_version: ${{ steps.meta.outputs.full_version }}
      safe_version: ${{ steps.meta.outputs.safe_version }}
      release_notes: ${{ steps.meta.outputs.release_notes }}
      firebase_app_id: ${{ steps.meta.outputs.firebase_app_id }}
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Compute Auto-Increment Version & Release Notes
        id: meta
        run: |
          # 1. Base Semantic Version from pubspec.yaml
          BASE_VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          BASE_BUILD=$(grep '^version:' pubspec.yaml | head -n 1 | sed -E 's/version:.*[+]([0-9]+)/\1/')
          
          # Auto-increment build number using GitHub run_number + commit count
          RUN_NUM="${{ github.run_number }}"
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "1")

          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            INPUT_VER="${{ github.event.inputs.version_name }}"
            if [[ "$INPUT_VER" == *"+"* ]]; then
              SEM_VER="${INPUT_VER%+*}"
              BUILD_NUM="${INPUT_VER#*+}"
            else
              SEM_VER="$INPUT_VER"
              BUILD_NUM="$COMMIT_COUNT"
            fi
          else
            SEM_VER="${BASE_VERSION:-1.0.1}"
            # Ensure build number strictly increases across every commit & workflow run
            if [ "$COMMIT_COUNT" -gt "${BASE_BUILD:-1}" ]; then
              BUILD_NUM="$COMMIT_COUNT"
            else
              BUILD_NUM=$(( ${BASE_BUILD:-1} + RUN_NUM ))
            fi
          fi

          FULL_VERSION="${SEM_VER}+${BUILD_NUM}"
          SAFE_VERSION=$(echo "$FULL_VERSION" | tr '+' '-')

          echo "version_name=${SEM_VER}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "safe_version=${SAFE_VERSION}" >> $GITHUB_OUTPUT

          # 2. Release Notes Resolution
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            NOTES="${{ github.event.inputs.release_notes }}"
          else
            # Extract latest milestone summary from docs/IMPLEMENTATION_MEMORY.md or latest git commit
            LATEST_IMP=$(grep -E '^### `IMP-[0-9]+`' docs/IMPLEMENTATION_MEMORY.md 2>/dev/null | tail -n 1 | sed -E 's/^### `(IMP-[0-9]+)`[[:space:]]*[·.][[:space:]]*(.+)/\1: \2/' || true)
            COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || true)

            if [ -n "$LATEST_IMP" ]; then
              NOTES="$LATEST_IMP"
            elif [ -n "$COMMIT_MSG" ]; then
              NOTES="$COMMIT_MSG"
            else
              NOTES="Automated live release v${FULL_VERSION} with enhanced features and stability patches."
            fi
          fi

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 3. Resolve Firebase App ID for com.taratravel.app
          PKG_APP_ID=""
          if [ -f "android/app/google-services.json" ]; then
            PKG_APP_ID=$(node -e '
              try {
                const gs = require("./android/app/google-services.json");
                const client = gs.client.find(c => c.client_info?.android_client_info?.package_name === "com.taratravel.app") || gs.client[0];
                console.log(client?.client_info?.mobilesdk_app_id || "");
              } catch (e) {
                console.log("");
              }
            ')
          fi
          TARGET_APP_ID="${PKG_APP_ID:-1:616637846202:android:4c3feeff8af62994e6e883}"
          echo "firebase_app_id=${TARGET_APP_ID}" >> $GITHUB_OUTPUT

  # ── 3. COMPILE PRODUCTION ANDROID ARTIFACTS ─────────────────────────────────
  build-android:
    name: 🤖 Compile Release APK & AAB
    needs: [quality-gate, prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: 🔐 Setup Environment (.env for Asset Bundle)
        run: |
          # Start clean — never inherit stale values from .env.example
          : > .env

          # ── Supabase ──────────────────────────────────────────────────────
          echo "EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> .env

          # ── Google Sign-In (Web Client ID for serverClientId) ─────────────
          echo "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}" >> .env

          # ── Mapbox ────────────────────────────────────────────────────────
          echo "MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}" >> .env

          echo "✅ .env populated for release build"
          echo "--- .env contents (keys only) ---"
          cut -d= -f1 .env | grep -v '^#' | grep -v '^$'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://knhbkelbapqrnqaozwgb.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuaGJrZWxiYXBxcm5xYW96d2diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTU2NDcsImV4cCI6MjEwMjUzMTY0N30.vZtZWqEXW9eDAVzfSf_KPrn8T6LCkuuNcU2WZ4t1GS8' }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || '616637846202-puvdihfams46tvjiofdseamheem66pau.apps.googleusercontent.com' }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔐 Setup Android Keystore (Fallback to Debug Keystore if Secret Unset)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> android/key.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "✅ Production keystore configured."
          else
            echo "⚠️ No production keystore secret found; compiling standard release APK."
          fi

      - name: 🔨 Compile Release APKs (Universal + Split Per ABI)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons \
            --build-name="${{ needs.prepare-release.outputs.version_name }}" \
            --build-number="${{ needs.prepare-release.outputs.build_number }}" \
            --dart-define=APP_VERSION="${{ needs.prepare-release.outputs.full_version }}"

          flutter build apk --release --no-tree-shake-icons \
            --build-name="${{ needs.prepare-release.outputs.version_name }}" \
            --build-number="${{ needs.prepare-release.outputs.build_number }}" \
            --dart-define=APP_VERSION="${{ needs.prepare-release.outputs.full_version }}"

      - name: 🔨 Compile Production Android App Bundle (.aab with R8 Obfuscation)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --no-tree-shake-icons \
            --build-name="${{ needs.prepare-release.outputs.version_name }}" \
            --build-number="${{ needs.prepare-release.outputs.build_number }}" \
            --dart-define=APP_VERSION="${{ needs.prepare-release.outputs.full_version }}"

      - name: 📤 Stash Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tara-travel-android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # ── 4. SUPABASE STORAGE CLOUD DISPATCH & REMOTE CONFIG BUMP ─────────────────
  deploy-supabase:
    name: ☁️ Supabase Cloud OTA Distribution & Version DB Update
    needs: [build-android, prepare-release]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Retrieve Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tara-travel-android-release

      - name: 🚀 Upload APK to Supabase Storage (`app-releases`)
        id: upload_apk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "⚠️ Supabase secrets not configured; skipping remote storage upload."
            exit 0
          fi

          # Prefer arm64-v8a split APK (~25-35MB) to stay well within Supabase 50MB quota, falling back to universal app-release.apk
          APK_FILE=$(find . -name "*arm64-v8a*release.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find . -name "app-release.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "❌ APK file not found for upload."
            exit 1
          fi

          echo "Selected APK for Supabase upload: $APK_FILE (Size: $(du -h "$APK_FILE" | cut -f1))"

          # Ensure bucket 'app-releases' exists and is configured for public access
          echo "Ensuring Supabase storage bucket 'app-releases' exists..."
          curl -s -X POST "${SUPABASE_URL}/storage/v1/bucket" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"id":"app-releases","name":"app-releases","public":true,"file_size_limit":262144400}' > /dev/null 2>&1 || true

          # Update bucket in case it was created without appropriate limits
          curl -s -X PUT "${SUPABASE_URL}/storage/v1/bucket/app-releases" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"public":true,"file_size_limit":262144400}' > /dev/null 2>&1 || true

          VERSION="${{ needs.prepare-release.outputs.full_version }}"
          SAFE_VERSION="${{ needs.prepare-release.outputs.safe_version }}"
          REMOTE_FILENAME="tara-travel-v${SAFE_VERSION}.apk"

          echo "Uploading $APK_FILE to Supabase Storage as $REMOTE_FILENAME..."
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "${SUPABASE_URL}/storage/v1/object/app-releases/${REMOTE_FILENAME}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@${APK_FILE}")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1 | sed -e 's/HTTP_STATUS://')

          echo "Supabase upload HTTP Status: $HTTP_STATUS"
          if [ -n "$HTTP_BODY" ]; then
            echo "Supabase response: $HTTP_BODY"
          fi

          # If upload succeeds, use Supabase direct storage public link
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            DOWNLOAD_URL="${SUPABASE_URL}/storage/v1/object/public/app-releases/${REMOTE_FILENAME}"
            echo "✅ Successfully uploaded APK to Supabase Storage: $DOWNLOAD_URL"
          else
            echo "⚠️ Supabase storage upload returned HTTP $HTTP_STATUS (Project storage plan limit reached)."
            echo "Using GitHub Release direct download URL fallback for app_versions..."
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${REMOTE_FILENAME}"
          fi

          echo "DOWNLOAD_URL=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT

      - name: 📝 Update Supabase `app_versions` Remote Config Record
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DOWNLOAD_URL: ${{ steps.upload_apk.outputs.DOWNLOAD_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "⚠️ Supabase secrets not configured; skipping version DB bump."
            exit 0
          fi

          VERSION="${{ needs.prepare-release.outputs.full_version }}"
          MIN_VER="${{ github.event.inputs.min_supported_version || '1.0.0' }}"
          NOTES="${{ needs.prepare-release.outputs.release_notes }}"
          MAINTENANCE="${{ github.event.inputs.maintenance_mode || 'false' }}"
          FALLBACK_URL="${DOWNLOAD_URL:-https://tara-travel.app/download/android}"

          PAYLOAD=$(cat <<EOF
          {
            "platform": "android",
            "latest_version": "${VERSION}",
            "min_supported_version": "${MIN_VER}",
            "force_update_url": "${FALLBACK_URL}",
            "maintenance_mode": ${MAINTENANCE},
            "release_notes": "${NOTES}",
            "updated_at": "now()"
          }
          EOF
          )

          echo "Publishing version record to Supabase public.app_versions..."
          curl -s -X POST "${SUPABASE_URL}/rest/v1/app_versions" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "${PAYLOAD}"

          echo "✅ Version record successfully registered in Supabase."

  # ── 5. GITHUB RELEASES DISPATCH (HIGH CAPACITY HOSTING) ─────────────────────
  deploy-github-release:
    name: 🐙 Publish GitHub Release
    needs: [build-android, prepare-release]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Retrieve Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tara-travel-android-release
          path: release-assets

      - name: 🚀 Create / Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.prepare-release.outputs.full_version }}"
          TAG="v${VERSION}"
          SAFE_VERSION="${{ needs.prepare-release.outputs.safe_version }}"

          # Stash individual files into a flat upload directory
          mkdir -p release-upload
          find release-assets -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} release-upload/ \;

          # Clean naming for primary download links
          find release-upload -name "*arm64-v8a*release.apk" -exec cp {} "release-upload/tara-travel-v${SAFE_VERSION}-arm64.apk" \; || true
          find release-upload -name "app-release.apk" -exec cp {} "release-upload/tara-travel-v${SAFE_VERSION}.apk" \; || true
          find release-upload -name "app-release.aab" -exec cp {} "release-upload/tara-travel-v${SAFE_VERSION}.aab" \; || true

          NOTES="${{ needs.prepare-release.outputs.release_notes }}"

          echo "Publishing GitHub Release $TAG with assets:"
          ls -la release-upload

          gh release view "$TAG" > /dev/null 2>&1 && {
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" release-upload/* --clobber
          } || {
            echo "Creating new release $TAG..."
            gh release create "$TAG" release-upload/* \
              --title "Tara Travel v${VERSION}" \
              --notes "$NOTES" \
              --latest
          }

  # ── 6. FIREBASE APP DISTRIBUTION (BETA TESTERS) ─────────────────────────────
  deploy-firebase:
    name: 🔥 Firebase App Distribution Dispatch
    needs: [build-android, prepare-release]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Retrieve Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tara-travel-android-release

      - name: 🚀 Dispatch to Firebase Beta Testers
        env:
          FIREBASE_APP_ID: ${{ needs.prepare-release.outputs.firebase_app_id }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          RELEASE_NOTES: ${{ needs.prepare-release.outputs.release_notes }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_TOKEN" ]; then
            echo "ℹ️ Firebase credentials not provided. Skipping Firebase App Distribution dispatch."
            exit 0
          fi

          APK_FILE=$(find . -name "app-release.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ APK file not found for Firebase distribution."
            exit 1
          fi

          echo "Dispatching $APK_FILE to Firebase App Distribution for app $FIREBASE_APP_ID..."
          # Uses Firebase CLI via npx
          npx firebase-tools appdistribution:distribute "$APK_FILE" \
            --app "$FIREBASE_APP_ID" \
            --token "$FIREBASE_TOKEN" \
            --release-notes "$RELEASE_NOTES"
